<!-- // Cart -->


<div class="js-menu__context" [ngClass]="{ 'js-menu__expanded': isCartDrawer }">
    <div id="main-nav" class="js-menu js-menu--right" [ngClass]="{ 'js-menu__expanded': isCartDrawer }">
        <div class="cart">
            <div class="cart-header d-flex justify-content-between">
                <span>Shopping Cart</span>
                <span class="js-menu__close" (click)="closeCartDrawer()">✕</span>
            </div>
            <div class="cart-body">
                <div class="empty-cart" *ngIf="this.cartProducts.length === 0">
                    <p>No products in the cart.</p>
                </div>
                <div class="cart-items">
                    <div *ngFor="let item of this.cartProducts;index as i">
                        <div class="cart-item p-3 border border-top d-flex justify-content-between">
                            <div class="cart-item-img-title d-flex cart-item-{{i}}">
                                <div class="cart-item-image">
                                    <img src="{{ item.image }}" alt="">
                                </div>
                                <div class="cart-item-title-price ms-3">
                                    <div class="cart-item-title">
                                        <a class="text-dark" [routerLink]="['/product']">{{ item.title }}</a>
                                    </div>
                                    <div class="cart-item-price">
                                        {{ item.quantity }}×${{ item.price }}
                                    </div>
                                </div>
                            </div>
                            <button type="button" class="close bg-transparent border-0" aria-label="Close"
                                (click)="removeItem(item)">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="cart-footer d-flex flex-column">
                <div class="total-amount d-flex p-3 border justify-content-between" *ngIf="this.cartProducts.length !== 0">
                    <span>Subtotal:</span><span>${{ getTotal }}</span>
                </div>
                <div class="button">
                    <a class="btn btn-outline-danger mt-2 btn-lg d-block rounded-0" href="#"
                        *ngIf="this.cartProducts.length === 0">CONTINUE SHOPPING
                    </a>
                    <a class="btn btn-outline-danger mt-2 btn-lg d-block rounded-0" [routerLink]="['/cart']"
                        *ngIf="this.cartProducts.length !== 0">VIEW CART
                    </a>
                    <a class="btn btn-outline-danger mt-2 btn-lg d-block rounded-0" [routerLink]="['/checkout']"
                        *ngIf="this.cartProducts.length !== 0">CHECKOUT
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
