<div class="flawless-background">
    <app-header></app-header>
    <div class="container">
        <div class="checkout-form-container card border-0 rounded-0 mt-5">
            <div class="checkout-form-heading h4 pb-2 mb-4 text-danger border-2 border-bottom border-black">
                <h2 class="">Checkout</h2>
            </div>
            <div class="checkout-form row d-flex flex-wrap mt-5">
                <div class="checkout-form-item col-md-6">
                    <div class="h4 pb-2 mb-4 border-2 border-bottom border-black">
                        <label>Billing Details</label>
                    </div>
                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" placeholder="John Doe" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="john@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <input type="text" class="form-control" id="address" placeholder="123 Main St" required>
                        </div>
                        <div class="mb-3">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" placeholder="New York" required>
                        </div>
                        <div class="mb-3">
                            <label for="zipcode" class="form-label">Zip Code</label>
                            <input type="text" class="form-control" id="zipcode" placeholder="10001" required>
                        </div>
                        <div class="mb-3">
                            <label for="card" class="form-label">Credit Card Number</label>
                            <input type="text" class="form-control" id="card" placeholder="1234 5678 9012 3456"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="expiry" class="form-label">Expiration Date</label>
                            <input type="text" class="form-control" id="expiry" placeholder="MM/YY" required>
                        </div>
                        <div class="mb-3">
                            <label for="cvv" class="form-label">CVV</label>
                            <input type="text" class="form-control" id="cvv" placeholder="123" required>
                        </div>
                    </form>
                </div>
                <div class="checkout-form-item billing-details card col-md-6 p-5 rounded-0">
                    <h4 class="mb-3 fw-bold">Your order</h4>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th scope="col">Total</th>
                                    <th scope="col">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Mark</td>
                                    <td>Otto</td>
                                </tr>
                                <tr>
                                    <td>Jacob</td>
                                    <td>@fat</td>
                                </tr>
                                <tr>
                                    <td>Larry the Bird</td>
                                    <td>@twitter</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="order-btn">
                        <a class="btn btn-outline-danger mt-2 d-block rounded-0" href="">PLACE ORDER</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <app-our-services></app-our-services>
    <app-footer></app-footer>
</div>
