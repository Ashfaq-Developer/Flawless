<div class="product-page flawless-background">
    <app-header></app-header>
    <div class="container">
        <div class="product d-flex my-5 row">
            <div class="product-item card border-0 col-md-6 p-5">
                <div class="product-left-item">
                    <img class="img-fluid w-100" src="{{ productItem.image }}" alt="">
                </div>
            </div>
            <div class="product-item card border-0 col-md-6 p-5">
                <div class="product-right-item border-bottom pb-3">
                    <div class="product-item-type">
                        <a>{{ productItem.type }}</a>
                    </div>
                    <div class="product-item-title">
                        <h1>
                            {{ productItem.title}}
                        </h1>
                    </div>
                    <div class="product-item-price">
                        <span class="price text-muted fs-4 fw-bold">$ {{ productItem.price }}</span><span> + Free
                            Shipping</span>
                    </div>
                    <div class="product-item-description" [innerHTML]="productItem.description"></div>
                    <div class="product-item-action-btn d-flex mt-3">
                        <div class="product-item-quantity d-inline-block w-25 me-2">
                            <!-- <label class="screen-reader-text" for="quantity_64ed95c040d00">
                            Hybrid Cleansing Balm quantity
                            </label> -->
                            <input type="number" id="quantity_64ed95c040d00" class="input-text qty text form-control"
                                name="quantity" value="1" aria-label="Product quantity" size="4" min="1" max="" step="1"
                                placeholder="" inputmode="numeric" autocomplete="off">
                        </div>
                        <div class="product-item-add-to-cart-btn d-block w-100">
                            <a href="" class="btn btn-outline-danger d-block rounded-0 w-100">ADD TO CART</a>
                        </div>
                    </div>
                </div>
                <div class="product-item-category mt-2">
                    Category: {{ productItem.type }}
                </div>
            </div>
        </div>
    </div>
    <app-our-services></app-our-services>
</div>
<app-footer></app-footer>
