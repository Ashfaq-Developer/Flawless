<div class="text-center my-auto">
    <div class="card text-bg-dark card-block justify-content-center border-0 rounded-0" *ngFor="let item of banner_content">
        <img src="{{ item.img_url }}" class="card-img" alt="...">
        <div class="card-img-overlay align-middle">
            <h5 class="card-title">{{ item.title }}</h5>
            <h1>{{ item.heading }}</h1>
            <p class="card-text"><small>Last updated 3 mins ago</small></p>
            <div class="button">
                <a class="btn btn-danger" href="#">SHOP NOW</a>
            </div>
        </div>
    </div>
</div>
