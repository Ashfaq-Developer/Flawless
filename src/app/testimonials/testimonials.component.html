<div class="testimonials py-5 flawless-background">
    <div class="container text-center">
        <div class="row py-5">
            <div class="col-md-4" *ngFor="let item of testimonials">
                <div class="testimonials-body">
                    <div class="star-rating" style="color: red;font-size: 25px;">
                        ★★★★★
                    </div>
                    <!-- <i class="fa fa-star"></i> -->
                    <p>
                        {{ item.para }}
                    </p>
                    <div class="image">
                        <img class="rounded-circle" src="{{ item.client_img_url }}" alt="">
                    </div>
                    <h5 class="paragraph text">{{ item.client_name }}</h5>
                </div>
            </div>
        </div>
    </div>
</div>
